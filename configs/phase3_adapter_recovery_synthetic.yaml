# Phase 3 P1-7 genuine parameter-space adapter-recovery attack, SYNTHETIC
# TIER ONLY. Same caveat as the rest of Phase 3: the null-signal fixture has
# no learnable signal, so functional_recovery_fine_macro_f1 numbers here sit
# at the same synthetic-data floor as every other Phase 3 attack -- this
# config validates the PARAMETER-SPACE recovery mechanism (which does not
# depend on the fixture having real signal, since it operates directly on
# the adapter's own weight matrix) and reports functional recovery alongside
# it for completeness, not as a claim about real attack effectiveness.
data:
  num_centers: 6
  samples_per_center: 32
  image_size: 32
  data_seed: 0
model:
  feature_dim: 64
  adapter_rank: 4
train:
  rounds: 3
  epochs_per_round: 1
  batch_size: 8
  lr: 0.01
seeds: [0, 1, 2]
reveal_fractions: [0.2, 0.5, 0.9]   # single-attacker parameter-space completion
collusion_reveal_fraction_each: 0.3
completion_iterations: 100
output_dir: experiments/phase3_adapter_recovery_synthetic
