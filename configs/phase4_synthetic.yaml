# Phase 4 privacy mechanisms, SYNTHETIC TIER ONLY. Same caveat as
# Phases 1-3: no real signal in the fixture, so utility numbers are floor-
# level regardless of arm. This validates the mechanism code paths
# (secure-aggregation masking, Opacus DP-SGD, and their combination) and
# produces a genuine (if synthetic-scale) privacy-utility Pareto shape;
# it is not evidence about real Fed-ISIC2019 privacy-utility tradeoffs.
data:
  source: synthetic
  num_centers: 6
  samples_per_center: 32
  image_size: 32
  data_seed: 0
model:
  feature_dim: 64
  adapter_rank: 4
train:
  rounds: 2               # lower than Phase 1-3's 3: DP-SGD's per-round Opacus setup adds real overhead
  epochs_per_round: 1
  batch_size: 8
  lr: 0.01
dp:
  noise_multipliers: [0.5, 1.0, 2.0]   # multiple privacy budgets, per the project brief
  max_grad_norm: 1.0
  delta: 1.0e-5
seeds: [0, 1, 2]
output_dir: experiments/phase4_synthetic
