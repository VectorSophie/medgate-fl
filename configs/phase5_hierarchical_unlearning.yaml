# P1 requirement #5 (repair pass 4): patient-level and patient-group
# unlearning, hierarchical fixture. Same train budget as
# configs/phase1_hierarchical.yaml; 3 seeds (matches
# configs/phase5_synthetic.yaml's "3 for development" convention).
data:
  num_patients_per_institution: 12
  observations_per_patient: 3
  image_size: 32
  class_imbalance_strength: 0.5
  sensitive_property_correlation: 0.6
  train_frac: 0.6
  val_frac: 0.2
model:
  feature_dim: 32
  adapter_rank: 4
train:
  rounds: 4
  epochs_per_round: 2
  batch_size: 8
  lr: 0.02
unlearning:
  adapter_deletion_epochs: 3
  ascent_steps: 5
  descent_steps: 5
  batch_size: 8
  lr: 0.02
removal:
  institution_index: 0
  patient_group_size: 3
seeds: [0, 1, 2]
output_dir: experiments/phase5_hierarchical_unlearning
